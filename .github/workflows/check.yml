name: MoonBit Maintainer Check

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - run: moon test
      - run: moon run cmd/main -- --root . --profile release --format json --output moonbit-health-report.json --fail-on-policy
      - run: moon run cmd/main -- --root . --profile release --format markdown --output moonbit-health-report.md --fail-on-policy
      - uses: actions/upload-artifact@v4
        with:
          name: moonbit-health-report
          path: |
            moonbit-health-report.json
            moonbit-health-report.md
